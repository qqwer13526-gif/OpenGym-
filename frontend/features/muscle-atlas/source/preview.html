function prepareGeometry(rebuild=false){const m=svg.getScreenCTM(),scale=Math.max(.05,Math.hypot(m.a,m.b)*view.k);if(rebuild||!spatialReady||Math.abs(scale-geometryScale)>.0001){geometryScale=scale;cellSize=90/scale;visiblePoints=nodes.filter(nodeVisible);cells.clear();entries.clear();spatialReady=true}for(const n of visiblePoints)indexPoint(n)}
function queryBox(b){const found=new Set();for(const key of keysFor(b))for(const n of cells.get(key)||[])found.add(n);return found}
function nearby(n,p=n){return queryBox(pointBox(n,p,8/geometryScale))}
function pathNeighbours(n,a,b){const pad=n.r+24/geometryScale;return queryBox({left:Math.min(a.x,b.x)-pad,right:Math.max(a.x,b.x)+pad,top:Math.min(a.y,b.y)-pad,bottom:Math.max(a.y,b.y)+pad})}
function flushPending(now){if(!pendingMoves.length)return;prepareGeometry();const moves=pendingMoves;pendingMoves=[];for(const move of moves)contactPath(move.n,move.before,move.after,now);projectCollisions()}

function clearance(a,b,soft=false){return a.r+b.r+(soft?20:5)/screenScale()}
function limits(n){return {left:35,right:1140,top:30,bottom:n.type==='group'?770:800}}
function clampPoint(p,n){const b=limits(n);return {x:Math.max(b.left,Math.min(b.right,p.x)),y:Math.max(b.top,Math.min(b.bottom,p.y))}}

function deterministicNormal(n){let sum=0;for(const c of n.id)sum=(sum*31+c.charCodeAt(0))>>>0;const angle=sum%360*Math.PI/180;return {x:Math.cos(angle),y:Math.sin(angle)}}
function activate(n,normal,depth=0){let a=avoiders.get(n.id);if(!a){a={n,normal,depth,pulse:null,until:0};avoiders.set(n.id,a)}return a}
function resetSprings(){avoiders.clear();parked.clear();spatialReady=false;pendingMoves=[]}
function stopPhysics(){cancelAnimationFrame(physicsRAF);physicsRAF=0;avoiders.clear();parked.clear();spatialReady=false;pendingMoves=[];for(const n of nodes)n.vx=n.vy=0}
function rememberLocal(){for(const a of avoiders.values()){if(Math.hypot(a.n.x-a.n.ax,a.n.y-a.n.ay)>.3)parked.set(a.n.id,{n:a.n,normal:a.normal});else parked.delete(a.n.id)}}
function cost(p,n,preferred){
 let score=((p.x-preferred.x)**2+(p.y-preferred.y)**2)*8+((p.x-n.ax)**2+(p.y-n.ay)**2)*.5;
 const a=labelBounds.get(n.id);
 for(const other of nearby(n,p)){if(other===n)continue;const gap=clearance(n,other),d=Math.hypot(p.x-other.x,p.y-other.y);if(d<gap)score+=(gap-d)**2*500;
  const b=labelBounds.get(other.id);
  if(b){const cx=Math.max(other.x+b.x,Math.min(other.x+b.x+b.width,p.x)),cy=Math.max(other.y+b.y,Math.min(other.y+b.y+b.height,p.y));score+=Math.max(0,n.r+3/screenScale()-Math.hypot(p.x-cx,p.y-cy))**2*350}
  if(a){const cx=Math.max(p.x+a.x,Math.min(p.x+a.x+a.width,other.x)),cy=Math.max(p.y+a.y,Math.min(p.y+a.y+a.height,other.y));score+=Math.max(0,other.r+3/screenScale()-Math.hypot(other.x-cx,other.y-cy))**2*350}
  if(a&&b){const width=Math.max(0,Math.min(p.x+a.x+a.width,other.x+b.x+b.width)-Math.max(p.x+a.x,other.x+b.x)),height=Math.max(0,Math.min(p.y+a.y+a.height,other.y+b.y+b.height)-Math.max(p.y+a.y,other.y+b.y));score+=width*height*12}
 }

}
function normalFor(n,q,dir,dragged){
 const existing=avoiders.get(n.id);if(existing)return existing.normal;
 const normal={x:-dir.y,y:dir.x},r=clearance(n,dragged,true);
 const plus=clampPoint({x:q.x+normal.x*r,y:q.y+normal.y*r},n),minus=clampPoint({x:q.x-normal.x*r,y:q.y-normal.y*r},n);
 const relative=(n.x-q.x)*normal.x+(n.y-q.y)*normal.y;
 const plusCost=cost(plus,n,{x:n.x,y:n.y})+Math.max(0,-relative)*r;
 const minusCost=cost(minus,n,{x:n.x,y:n.y})+Math.max(0,relative)*r;
 return plusCost<=minusCost?normal:{x:-normal.x,y:-normal.y};
}
function desired(a,now){
 const n=a.n,home={x:n.ax,y:n.ay};let preferred=home;
 if(a.pulse&&now<a.until)preferred=a.pulse;
 const dragged=physicalDrag&&byId.get(physicalDrag.id);
 if(dragged){
  const normal=a.normal,along={x:normal.y,y:-normal.x},dx=home.x-dragged.x,dy=home.y-dragged.y,r=clearance(n,dragged,true);
  const parallel=dx*along.x+dy*along.y,side=dx*normal.x+dy*normal.y;
  if(Math.abs(parallel)<r&&Math.hypot(dx,dy)<r*1.5){
   const shift=Math.max(0,Math.sqrt(Math.max(0,r*r-parallel*parallel))-side);
   preferred={x:home.x+normal.x*shift,y:home.y+normal.y*shift};
  }
 }
 if(a.cached&&a.cachedScale===geometryScale&&now-a.cachedAt<40&&Math.hypot(preferred.x-a.cachedPreferred.x,preferred.y-a.cachedPreferred.y)<.25)return a.cached;
 const direct=clampPoint(preferred,n),directCost=cost(direct,n,preferred);
 if(directCost<.001){a.cached=direct;a.cachedAt=now;a.cachedPreferred={...preferred};a.cachedScale=geometryScale;return direct}
 // A few local candidate slots handle a stationary dropped obstacle and canvas boundaries.
 const candidates=[clampPoint(preferred,n),clampPoint(home,n)];
 const radius=(n.r+7)+23/screenScale();
 for(const factor of [1,1.7,2.5])for(let i=0;i<12;i++){
  const angle=Math.atan2(a.normal.y,a.normal.x)+i*Math.PI/6;
  candidates.push(clampPoint({x:home.x+Math.cos(angle)*radius*factor,y:home.y+Math.sin(angle)*radius*factor},n));
 }
 let best=candidates[0],score=cost(best,n,preferred);
 for(const p of candidates.slice(1)){const s=cost(p,n,preferred);if(s<score){best=p;score=s}}

}
function projectCollisions(allowChain=true){
 const dragged=physicalDrag&&byId.get(physicalDrag.id),scale=screenScale();
 for(let pass=0;pass<5;pass++){
  for(const a of [...avoiders.values()]){
   const n=a.n;if(!nodeVisible(n)||n===dragged)continue;
   for(const other of nearby(n)){if(other===n)continue;
    let dx=n.x-other.x,dy=n.y-other.y,d=Math.hypot(dx,dy),r=clearance(n,other);
    if(d>=r-.001)continue;
    if(d<.001){dx=a.normal.x;dy=a.normal.y;d=1}
    if(allowChain&&dragged&&other!==dragged&&!avoiders.has(other.id)&&a.depth<2&&Math.hypot(other.x-dragged.x,other.y-dragged.y)*scale<135){
     activate(other,{x:-dx/d,y:-dy/d},a.depth+1);
    }
    const both=other!==dragged&&avoiders.has(other.id);
    if(both&&n.id>other.id)continue;
    const shift=r-d+.05,factor=both ? .5 : 1;
    let p=clampPoint({x:n.x+dx/d*shift*factor,y:n.y+dy/d*shift*factor},n);
    if(!both&&Math.hypot(p.x-other.x,p.y-other.y)<r-.01){
     const candidates=[];for(let i=0;i<24;i++){const angle=Math.atan2(a.normal.y,a.normal.x)+i*Math.PI/12,q=clampPoint({x:other.x+Math.cos(angle)*(r+.15),y:other.y+Math.sin(angle)*(r+.15)},n);if(Math.hypot(q.x-other.x,q.y-other.y)>=r-.01)candidates.push(q)}
     let bestScore=Infinity;for(const q of candidates){const score=cost(q,n,p);if(score<bestScore){bestScore=score;p=q}}
    }
    n.x=p.x;n.y=p.y;n.vx=n.vy=0;indexPoint(n);
    if(both){const q=clampPoint({x:other.x-dx/d*shift*.5,y:other.y-dy/d*shift*.5},other);other.x=q.x;other.y=q.y;other.vx=other.vy=0;indexPoint(other)}
   }
  }

}
function stepAvoidance(now,dt=0,immediate=false){
 prepareGeometry();let error=0,speed=0;
 for(const a of [...avoiders.values()]){
  const n=a.n;if(!byId.has(n.id)||!nodeVisible(n)||physicalDrag?.id===n.id){avoiders.delete(n.id);continue}
  const before={x:n.x,y:n.y},target=desired(a,now),dx=target.x-n.x,dy=target.y-n.y;
  if(immediate){n.x=target.x;n.y=target.y;n.vx=n.vy=0}
  else{
   const omega=24;for(let k=0;k<3;k++){const t=dt/3;n.vx+=((target.x-n.x)*omega*omega-2*omega*n.vx)*t;n.vy+=((target.y-n.y)*omega*omega-2*omega*n.vy)*t;n.x+=n.vx*t;n.y+=n.vy*t}
   const p=clampPoint(n,n);n.x=p.x;n.y=p.y;
  }
  indexPoint(n);if(a.follow&&physicalDrag)contactPath(n,before,n,now);
  error=Math.max(error,Math.hypot(dx,dy));speed=Math.max(speed,Math.hypot(n.vx,n.vy));
 }
 projectCollisions();position();return {error,speed,pending:[...avoiders.values()].some(a=>a.until>now)};
}
function wakePhysics(){
 if(!avoiders.size&&!pendingMoves.length)return;
 if(motionQuery.matches){flushPending(performance.now());stepAvoidance(performance.now(),0,true);if(!physicalDrag){rememberLocal();avoiders.clear()}return}
 physicsStarted=performance.now();if(!physicsRAF){physicsLast=physicsStarted;physicsRAF=requestAnimationFrame(physicsTick)}
}
function physicsTick(now){
 const dt=Math.min(.025,Math.max(.001,(now-physicsLast)/1000));physicsLast=now;flushPending(now);const result=stepAvoidance(now,dt);
 if(result.pending||((result.error>.25||result.speed>.6)&&now-physicsStarted<2300))physicsRAF=requestAnimationFrame(physicsTick);
 else{physicsRAF=0;for(const a of avoiders.values())a.n.vx=a.n.vy=0;if(!physicalDrag){rememberLocal();avoiders.clear()}}
}
function beginPhysicalDrag(id){
 cancelAnimationFrame(physicsRAF);physicsRAF=0;rememberLocal();for(const a of avoiders.values())a.n.vx=a.n.vy=0;avoiders.clear();pendingMoves=[];labelBounds.clear();
 for(const point of nodes){if(!nodeVisible(point))continue;const b=point.el.querySelector('.node-label').getBBox();labelBounds.set(point.id,{x:b.x,y:b.y,width:b.width,height:b.height})}
 const n=byId.get(id);parked.delete(id);prepareGeometry(true);physicalDrag={id,previous:{x:n.x,y:n.y},origin:{x:n.x,y:n.y},direction:{x:1,y:0},members:n.type==='group'?nodes.filter(m=>m.type==='muscle'&&m.group===id).map(m=>({n:m,x:m.x,y:m.y})):[]};n.vx=n.vy=0;
 for(const m of physicalDrag.members){parked.delete(m.n.id);activate(m.n,deterministicNormal(m.n)).follow=true}
 // Only neighbours whose home is blocked by this very dot may return when it leaves.
 for(const [key,p]of parked){if(!byId.has(key)){parked.delete(key);continue}if(nodeVisible(p.n)&&Math.hypot(p.n.ax-n.x,p.n.ay-n.y)<clearance(p.n,n,true))activate(p.n,p.normal)}
}
function movePhysicalDrag(n){
 if(!physicalDrag)return;if(!physicalDrag.started){n.el.classList.add('dragging');physicalDrag.started=true}
 const before=physicalDrag.previous,dx=n.x-before.x,dy=n.y-before.y,length=Math.hypot(dx,dy);
 if(length>.01)physicalDrag.direction={x:dx/length,y:dy/length};
 const now=performance.now();
 for(const m of physicalDrag.members){const p=clampPoint({x:m.x+n.x-physicalDrag.origin.x,y:m.y+n.y-physicalDrag.origin.y},m.n);m.n.ax=p.x;m.n.ay=p.y}

function contactPath(n,before,after,now){

  if(other===n||physicalDrag.id===other.id||physicalDrag.members.some(m=>m.n===other))continue;
  const q=closest(other,before,after),r=clearance(other,n,true);
  if(Math.hypot(other.x-q.x,other.y-q.y)>=r)continue;

function endPhysicalDrag(n){

 if(n.type==='exercise'){
  const action=userActions.find(a=>a.id===n.id);
  if(action){const copy=userActions.map(a=>a.id===n.id?{...a,position:{x:n.x,y:n.y}}:a);if(persist(copy,showActions))userActions=copy;else{const old=action.position||{x:n.initial[0],y:n.initial[1]};n.x=n.ax=old.x;n.y=n.ay=old.y}}
 }

function status(message,error=false){$('saveStatus').textContent=message;$('saveStatus').classList.toggle('error',error)}
function uid(){return 'user-'+crypto.randomUUID()}
function validateActions(raw){if(!Array.isArray(raw)||raw.length>100)throw Error('最多保存100个动作。');const ids=new Set();return raw.map(a=>{if(!a||typeof a!=='object'||typeof a.id!=='string'||!/^user-[a-z0-9-]{1,80}$/.test(a.id)||ids.has(a.id))throw Error('动作编号无效或重复。');ids.add(a.id);if(typeof a.label!=='string'||!a.label.trim()||a.label.trim().length>60)throw Error('动作名称应为1～60字。');for(const key of ['primary','secondary'])if(!Array.isArray(a[key])||a[key].length>18||a[key].some(id=>!D.muscles.some(m=>m.id===id))||new Set(a[key]).size!==a[key].length)throw Error('参与肌群无效。');if(!a.primary.length||a.primary.some(id=>a.secondary.includes(id)))throw Error('至少选择一个主要肌群，主辅不能重复。');for(const [key,max]of [['equipment',80],['notes',800]])if(typeof a[key]!=='string'||a[key].length>max)throw Error('器械或备注内容过长。');let position;if(a.position!==undefined){if(!a.position||!['x','y'].every(k=>typeof a.position[k]==='number'&&Number.isFinite(a.position[k]))||a.position.x<35||a.position.x>1140||a.position.y<30||a.position.y>800)throw Error('动作位置无效。');position={x:a.position.x,y:a.position.y}}return {id:a.id,label:a.label.trim(),equipment:a.equipment.trim(),notes:a.notes.trim(),primary:[...a.primary],secondary:[...a.secondary],...(position?{position}:{}),provenance:'user'}})}
function persist(actions,layer,allowRepair=false){if(storageBlocked&&!allowRepair){status('本地记录读取异常，请先导出原始记录再导入备份。',true);return false}try{localStorage.setItem(STORE,JSON.stringify({version:1,actions,showActions:layer}));storageBlocked=false;status('已保存在本机');return true}catch(e){status('保存失败，请检查浏览器存储权限。原记录未覆盖。',true);return false}}
function loadActions(){try{const raw=localStorage.getItem(STORE);if(!raw)return;const d=JSON.parse(raw);if(d.version!==1||typeof d.showActions!=='boolean')throw Error('version');userActions=validateActions(d.actions);showActions=d.showActions;status('已恢复本机动作')}catch(e){storageBlocked=true;status('本地记录读取异常，原始记录仍保留。',true)}}
function rebuildActions(){
 paintKey='';stopPhysics();for(let i=edges.length-1;i>=0;i--)if(edges[i].role!=='membership'){edges[i].el.remove();edges.splice(i,1)}
 for(let i=nodes.length-1;i>=0;i--)if(nodes[i].type==='exercise'){nodes[i].el.remove();byId.delete(nodes[i].id);nodes.splice(i,1)}
 const actions=[...userActions.filter(a=>!showExamples||!EXAMPLES.some(e=>e.id===a.id)),...(showExamples?EXAMPLES:[])];
 actions.forEach((a,index)=>{const members=a.primary.map(id=>byId.get(id)),cx=members.reduce((s,n)=>s+n.x,0)/members.length,cy=members.reduce((s,n)=>s+n.y,0)/members.length,angle=index*2.4;
 const x=a.position?.x??Math.max(50,Math.min(1125,cx+100*Math.cos(angle))),y=a.position?.y??Math.max(40,Math.min(785,cy+100*Math.sin(angle)));
 const n={...a,type:'exercise',group:members[0].group,color:'#b6bfca',r:8,x,y,ax:x,ay:y,vx:0,vy:0};add(n);mountNode(n);
 for(const[role,ids]of [['primary',a.primary],['secondary',a.secondary],['stability',a.stabilizers||[]]])for(const id of ids){const e={a:a.id,b:id,role};e.el=element('path',{class:'graph-edge '+role,'data-from':a.id,'data-to':id},$('edges'));edges.push(e)}});

}

function initDialogs(){$('actionDialogs').innerHTML=`<dialog id="managerDialog" aria-labelledby="managerTitle"><div class="dialog-title"><h2 id="managerTitle">我的动作</h2><button data-close="managerDialog" aria-label="关闭动作管理">×</button></div><p>默认底图只显示肌群。你创建的动作保存在这台设备，可以随时显示或隐藏。</p><div class="manager-tools"><button id="managerAdd">＋ 新建动作</button><button id="exportActions">导出备份</button><button id="importActions">导入备份</button></div><input id="importFile" type="file" accept=".json,application/json" hidden><div id="importReview" class="import-review" hidden></div><p class="form-error" id="managerError" role="alert"></p><div id="savedActionList"></div></dialog><dialog id="editorDialog" aria-labelledby="editorTitle"><div class="dialog-title"><h2 id="editorTitle">添加动作</h2><button data-close="editorDialog" aria-label="取消编辑">×</button></div><form id="actionForm"><label class="form-field">可选学习模板<select id="actionTemplate"><option value="">从空白开始</option><option value="bench">杠铃卧推</option><option value="squat">杠铃深蹲</option><option value="deadlift">杠铃硬拉</option></select></label><label class="form-field">动作名称<input id="actionName" maxlength="60" required placeholder="例如：我的哑铃划船"></label><label class="form-field">器械<input id="actionEquipment" maxlength="80" placeholder="可不填"></label><p>至少选择一个主要肌群。主辅关系由你指定，保存后标记为自定义。</p><div class="muscle-picker" id="musclePicker"></div><label class="form-field">备注<textarea id="actionNotes" maxlength="800" placeholder="记录动作变式或自己的提示"></textarea></label><p class="form-error" id="editorError" role="alert"></p><div class="form-actions"><button type="button" class="secondary-btn" data-close="editorDialog">取消</button><button type="submit">保存动作</button></div></form></dialog>`;
 $('examplesToggle').onclick=()=>setExamples(!showExamples);
 document.addEventListener('click',e=>{const button=e.target.closest('[data-copy-example]');if(!button)return;const a=EXAMPLES.find(a=>a.id===button.dataset.copyExample);openEditor();fillForm({...a,secondary:[...a.secondary,...a.stabilizers],notes:a.notes+'\n从示例建立；辅助参与包含协同与稳定，关系可自行修改。'})});
 $('addAction').onclick=()=>openEditor();$('manageActions').onclick=openManager;$('managerAdd').onclick=()=>openEditor();$('layerToggle').onclick=()=>{if(!userActions.length){openManager();return}setLayer(!showActions)};
 document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close)$(close.dataset.close).close();const edit=e.target.closest('[data-edit-action]');if(edit)openEditor(edit.dataset.editAction);const del=e.target.closest('[data-delete-action]');if(del){const id=del.dataset.deleteAction;if(pendingDelete===id){if(commit(userActions.filter(a=>a.id!==id))){pendingDelete=null;renderManager()}else $('managerError').textContent=$('saveStatus').textContent}else{pendingDelete=id;renderManager()}}if(e.target.closest('#detailManager'))openManager()});
 $('actionTemplate').onchange=()=>{const t=templates[$('actionTemplate').value];if(t)fillForm(t)};$('actionForm').onsubmit=saveEditor;
 $('exportActions').onclick=()=>{const raw=storageBlocked?localStorage.getItem(STORE):JSON.stringify({version:1,actions:userActions,showActions},null,2);const url=URL.createObjectURL(new Blob([raw||''],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=storageBlocked?'FitPilot-原始记录.txt':'FitPilot-我的动作.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
 $('importActions').onclick=()=>$('importFile').click();$('importFile').onchange=prepareImport;
}
function picker(){return D.groups.map(g=>'<div class="picker-group">'+esc(g.label)+'</div>'+D.muscles.filter(m=>m.group===g.id).map(m=>'<label class="picker-row"><span>'+esc(m.label)+'</span><select data-muscle-role="'+m.id+'" aria-label="'+esc(m.label)+'参与角色"><option value="">不关联</option><option value="primary">主要参与</option><option value="secondary">辅助参与</option></select></label>').join('')).join('')}
function fillForm(a){$('actionName').value=a.label||'';$('actionEquipment').value=a.equipment||'';$('actionNotes').value=a.notes||'';for(const el of $('musclePicker').querySelectorAll('select'))el.value=(a.primary||[]).includes(el.dataset.muscleRole)?'primary':(a.secondary||[]).includes(el.dataset.muscleRole)?'secondary':''}
let editingId=null;
function openEditor(id=null){editingId=id;$('editorTitle').textContent=id?'编辑动作':'添加动作';$('musclePicker').innerHTML=picker();$('actionTemplate').value='';$('editorError').textContent='';fillForm(userActions.find(a=>a.id===id)||{});if(!$('editorDialog').open)$('editorDialog').showModal();$('actionName').focus()}
function saveEditor(e){e.preventDefault();const primary=[],secondary=[];for(const el of $('musclePicker').querySelectorAll('select'))if(el.value)(el.value==='primary'?primary:secondary).push(el.dataset.muscleRole);const old=userActions.find(a=>a.id===editingId),a={...(old||{}),id:editingId||uid(),label:$('actionName').value,equipment:$('actionEquipment').value,notes:$('actionNotes').value,primary,secondary};try{validateActions([a]);if(!commit(editingId?userActions.map(item=>item.id===editingId?a:item):[...userActions,a],true))throw Error($('saveStatus').textContent);$('editorDialog').close();if($('managerDialog').open)renderManager();choose(a.id)}catch(error){$('editorError').textContent=error.message}}
function openManager(){pendingDelete=null;$('managerError').textContent='';renderManager();if(!$('managerDialog').open)$('managerDialog').showModal()}
function renderManager(){$('exportActions').textContent=storageBlocked?'导出原始记录':'导出备份';$('savedActionList').innerHTML=userActions.length?userActions.map(a=>'<div class="saved-action"><span class="name">'+esc(a.label)+'<small>自定义 · '+a.primary.map(id=>esc(byId.get(id).label)).join('、')+'</small></span><button data-edit-action="'+a.id+'">编辑</button><button class="danger" data-delete-action="'+a.id+'">'+(pendingDelete===a.id?'确定删除':'删除')+'</button></div>').join(''):'<div class="empty-actions"><strong>从你的第一个动作开始</strong><br>点击“新建动作”，选择主要与辅助肌群。<br>也可以从三个可修改的学习模板开始。</div>'}
async function prepareImport(){const file=$('importFile').files[0];$('importFile').value='';if(!file)return;try{if(file.size>2*1024*1024)throw Error('备份不能超过2 MiB。');const d=JSON.parse(await file.text());if(d.version!==1)throw Error('无法识别这个备份版本。');const incoming=validateActions(d.actions),merged=[...userActions];let added=0,skipped=0;for(let a of incoming){const old=merged.find(v=>v.id===a.id);if(old&&JSON.stringify(old)===JSON.stringify(a)){skipped++;continue}if(old)a={...a,id:uid()};merged.push(a);added++}validateActions(merged);pendingImport=merged;$('managerError').textContent='';$('importReview').hidden=false;$('importReview').innerHTML='将新增 '+added+' 个动作，跳过 '+skipped+' 个相同记录。现有动作保留。'+(storageBlocked?'当前本地原始记录无法解析；请先导出原始记录，确认后会保存本次备份。':'')+'<div class="dialog-actions"><button id="confirmImport">合并导入</button><button id="cancelImport">取消</button></div>';$('confirmImport').onclick=()=>{if(commit(pendingImport,showActions,true)){$('importReview').hidden=true;pendingImport=null;renderManager()}else $('managerError').textContent=$('saveStatus').textContent};$('cancelImport').onclick=()=>{$('importReview').hidden=true;pendingImport=null}}catch(e){$('managerError').textContent='导入失败：'+e.message;pendingImport=null;$('importReview').hidden=true}}
function initActions(){loadActions();initDialogs();rebuildActions();updateActionControls()}

$('graphCount').innerHTML='<strong>05</strong> 个中心　·　'+D.muscles.length+' 个肌群节点';position();updateView();paint();showDetail();initActions();

})();
