  const achieved=l=>l.sets.every(s=>s.reps>=item.target.max)&&l.effort!=='hard';
  // Separate dates prevent two submissions from one session triggering progression.
  if(two.length===2&&two[0].date!==two[1].date&&two.every(l=>completed(l)&&achieved(l)))return {kind:'progress',title:'可以考虑下一档重量',body:'两个不同日期都完成了当前重量的次数上限，且自评未接近极限。'+(item.target.step===null?'先填写器械允许的最小加重档位，再决定是否调整。':'可以预览增加 '+item.target.step+' 公斤；确认后才修改计划。'),value:item.target.step===null?null:Math.round((item.target.weight+item.target.step)*100)/100,evidence:two.map(l=>l.date)};
  if(two.length===2&&two[0].date!==two[1].date&&two.every(l=>completed(l)&&l.sets.some(s=>s.reps<item.target.min)))return {kind:'review',title:'先检查目标与休息安排',body:'两个不同日期都有组数未达到次数下限。可考虑维持或降低负重，并检查组间休息；系统不据此判断动作质量。',evidence:two.map(l=>l.date)};
  const last=recent[0];const sameLoad=last.sets.length&&last.sets.every(s=>s.weight===last.sets[0].weight),previous=last.sets[0]?.weight;
  if(sameLoad&&previous>0&&item.target.weight>previous*1.10)return {kind:'review',title:'确认这次加重量',body:'计划重量比最近同口径记录高 '+Math.round((item.target.weight/previous-1)*100)+'%。请结合完成表现确认；此提示不代表风险诊断。',evidence:[last.date]};
  return {kind:'hold',title:'继续积累完成记录',body:'先观察是否稳定完成目标次数；目前没有触发加重建议。',evidence:[last.date]};
 }
 function suggestions(plan,day){const items=plan.days[day].items,all=plan.days.flatMap(d=>d.items),result=[];const add=(id,title,body,extra={})=>result.push({id,title,body,...extra});if(!all.length)return [{id:'start',title:'从一个训练日开始',body:'选择动作，填写计划重量、组数和次数。'}];
  const stats=coverage(all);if(plan.config.focus==='all'){const missing=Object.keys(groupNames).filter(g=>!stats[g].direct&&!stats[g].indirect);if(missing.length)add('coverage','看看本周的覆盖范围','你选择了全身目标；当前计划尚未安排涉及'+missing.map(g=>groupNames[g]).join('、')+'的动作。',{basis:'只检查图谱中已收录的区域，不代表全身完整评估。'})}
  const patterns=new Map();for(const i of items){const p=i.exercise.pattern;if(p!=='custom'){if(!patterns.has(p))patterns.set(p,[]);patterns.get(p).push(i)}}for(const [p,rows]of patterns)if(rows.length>=3)add('repeat-'+p,'同类动作可以精简',patternNames[p]+'安排了'+rows.length+'项、共'+rows.reduce((s,i)=>s+i.target.sets,0)+'组。可以按优先级保留；这是重复提醒，不是过量诊断。');
  const minutes=estimate(items);if(minutes>plan.config.minutes)add('time','本次可能超过可用时间','按当前次数与休息估算约'+minutes+'分钟，你设置了'+plan.config.minutes+'分钟。可减少次要动作。',{basis:'每次动作暂按3秒、动作切换按1分钟估算，不含热身。'});
  const priority=items.findIndex(i=>i.exercise.id===plan.config.priority);if(priority>0)add('priority','把重点动作放在前面',items[priority].exercise.label+'是你设置的重点动作，目前排在第'+(priority+1)+'项。',{action:{type:'moveFirst',itemId:items[priority].id}});
  else if(plan.config.goal==='strength'&&items.length&&!items[0].exercise.compound){const index=items.findIndex(i=>i.exercise.compound);if(index>0)add('order','考虑先做主要复合动作','当前从孤立动作开始；如果以力量表现为目标，可以预览将'+items[index].exercise.label+'前置。',{action:{type:'moveFirst',itemId:items[index].id}})}
  const current=coverage(items),previous=coverage(plan.days[(day+6)%7].items);const repeated=Object.keys(groupNames).filter(g=>current[g].direct>=6&&previous[g].direct>=6);if(repeated.length)add('adjacent','留意连续两天的同区域安排',repeated.map(g=>groupNames[g]).join('、')+'在相邻两天都安排了至少6个主练组。可结合实际恢复感受决定是否换日。',{basis:'6组是本产品的提示阈值，不是生理恢复分界线。'});
  const unidentified=items.filter(i=>i.exercise.mode==='machine'&&!i.target.station);if(unidentified.length)add('machines','给器械取一个编号','有'+unidentified.length+'个器械动作还未指定具体器械。可在动作设置中填写编号；负重进阶只比较同一台器械。');
  const unknown=items.filter(i=>i.target.weight===null);if(unknown.length)add('weights','还有'+unknown.length+'个动作未填写重量','留空不按0公斤计算，也不会为这些动作猜测起始重量。');
  for(const i of items){const station=i.target.station||'';const advice=progression(i,plan.logs,station);if(['progress','review'].includes(advice.kind))add('load-'+i.id,i.exercise.label+'：'+advice.title,advice.body,{basis:(advice.evidence||[]).join('、'),...(advice.value!==null&&advice.value!==undefined&&advice.value<=1000?{action:{type:'weight',itemId:i.id,value:advice.value}}:{})})}
  if(!result.length)add('ready','计划已整理好','目前未触发结构调整提示。记录实际完成情况后，可进一步查看负重建议。');return result;
 }
 return {blank,validate,snapshot,coverage,estimate,progression,suggestions,groupNames,muscleGroups,modeNames,patternNames,clone,validDate};
});

</script><script>

  $('planAdd').onclick=()=>openLibrary();$('emptyAdd')?.addEventListener('click',()=>openLibrary());$('editGoal').onclick=openGoal;$('showDayGraph').onclick=()=>{tab('graph');syncGraph(true)};$('startDemo')?.addEventListener('click',startDemo);$('exitDemo')?.addEventListener('click',exitDemo);
  $('moreAdvice')?.addEventListener('click',()=>{const expanded=$('moreAdvice').getAttribute('aria-expanded')==='true';$('adviceList').classList.toggle('expanded',!expanded);$('moreAdvice').setAttribute('aria-expanded',String(!expanded));$('moreAdvice').textContent=expanded?'查看其余 '+(advice.length-3)+' 条':'收起'});
 }
 function renderHistory(limit=12){const logs=[...state.logs].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt).slice(0,limit);return (logs.length?logs.map(l=>`<div class="history-row"><div><strong>${esc(l.exercise.label)}</strong><span>${l.date} · ${l.sets.map(s=>s.weight+'公斤×'+s.reps+'次').join(' / ')}</span></div><button data-delete-log="${l.id}" aria-label="删除${esc(l.exercise.label)}${l.date}的训练记录">删除</button></div>`).join(''):'<p class="empty-history">完成训练后，在动作旁点“记录”。</p>')+(state.logs.length>limit?'<button class="text-button" data-open-history>查看全部记录</button>':'')}
 function add(id){const a=findAction(id)||A.nodes.find(n=>n.id===id&&n.type==='exercise');if(!a)return;const items=state.days[day].items;if(items.some(i=>i.exercise.id===id)){notice('这个动作已经在'+weekdays[day]+'的计划中');return}if(items.length>=12){notice('每天最多安排12个动作',true);return}const exercise=E.snapshot(a);if(change(s=>s.days[day].items.push({id:uid(),exercise,target:{sets:3,min:8,max:12,weight:exercise.mode==='bodyweight'?0:null,rest:90,step:null}}))){renderLibrary();notice('已加入'+weekdays[day]);}}

 function openGoal(){const c=state.config;$('goalSelect').value=c.goal;$('focusSelect').value=c.focus;$('minutesInput').value=c.minutes;const unique=[...new Map(state.days.flatMap(d=>d.items).map(i=>[i.exercise.id,i.exercise])).values()];$('prioritySelect').innerHTML='<option value="">不指定</option>'+unique.map(a=>`<option value="${a.id}">${esc(a.label)}</option>`).join('');$('prioritySelect').value=c.priority;$('goalError').textContent='';$('goalDialog').showModal()}

 function setRow(index,weight=null){return `<div class="actual-set"><span>${index+1}</span><input class="actual-weight" type="number" min="0" max="1000" step="0.25" required value="${weight??''}" aria-label="第${index+1}组实际公斤"><input class="actual-reps" type="number" min="0" max="100" required placeholder="次数" aria-label="第${index+1}组实际次数"></div>`}
 function preview(advice){const i=findItem(advice.action.itemId);if(!i)return;pending={type:'advice',advice,day};$('confirmError').textContent='';$('confirmTitle').textContent='调整预览';$('confirmText').textContent=advice.action.type==='weight'?i.exercise.label+'：'+weightText(i.target)+' → '+advice.action.value+' 公斤':i.exercise.label+'：第'+(state.days[day].items.findIndex(x=>x.id===i.id)+1)+'项 → 第1项';$('confirmApply').textContent='应用调整';$('confirmDialog').showModal()}

 function execute(){if(!pending)return;let ok=false;const p=pending;
  if(p.type==='advice')ok=change(s=>{const items=s.days[p.day].items,index=items.findIndex(i=>i.id===p.advice.action.itemId);if(index<0)throw Error('动作已变化，请重新检查');if(p.advice.action.type==='weight')items[index].target.weight=p.advice.action.value;else items.unshift(items.splice(index,1)[0])});

  if(ok){$('confirmDialog').close();pending=null;syncGraph(false);if($('historyDialog').open)$('allHistory').innerHTML=renderHistory(2000)}else $('confirmError').textContent='未能保存，原记录保留。请检查输入或浏览器存储空间。';
